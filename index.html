<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Kseniia Panferova — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
    rel="stylesheet"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/force-graph@1.51.4/dist/force-graph.min.js"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: "Inter", Arial, sans-serif;
    }

    body {
      position: relative;
    }

    #graph {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;

      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;

      padding: 20px;

      pointer-events: none;
    }

    .site-brand,
    .site-nav {
      pointer-events: auto;
    }

    .site-brand {
      padding: 10px 12px;

      background: rgba(0, 0, 0, 0.64);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .site-title {
      margin: 0;

      font-size: 16px;
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .site-subtitle {
      margin: 5px 0 0;

      font-size: 12px;
      color: rgba(255, 255, 255, 0.64);
    }

    .site-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .site-nav a {
      display: inline-block;

      padding: 9px 11px;

      color: #fff;
      background: rgba(0, 0, 0, 0.64);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;

      font-size: 12px;
      line-height: 1;
      text-decoration: none;

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      transition:
        background 160ms ease,
        border-color 160ms ease;
    }

    .site-nav a:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.38);
    }

    .instructions {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 20;

      margin: 0;
      padding: 9px 11px;

      color: rgba(255, 255, 255, 0.62);
      background: rgba(0, 0, 0, 0.64);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;

      font-size: 11px;

      pointer-events: none;

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    @media (max-width: 640px) {
      .site-header {
        padding: 12px;
        gap: 10px;
      }

      .site-brand {
        padding: 8px 9px;
      }

      .site-title {
        font-size: 13px;
      }

      .site-subtitle {
        display: none;
      }

      .site-nav {
        max-width: 62%;
        gap: 5px;
      }

      .site-nav a {
        padding: 7px 8px;
        font-size: 10px;
      }

      .instructions {
        left: 12px;
        bottom: 12px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="site-brand">
      <h1 class="site-title">Kseniia Panferova</h1>
      <p class="site-subtitle">Portfolio as a network of connected works</p>
    </div>

    <nav class="site-nav" aria-label="Main navigation">
      <a href="cv.html">CV</a>
      <a href="drawings.html">Drawings</a>
      <a href="photography.html">Photography</a>
      <a href="contact.html">Statement / Contact</a>
    </nav>
  </header>

  <div id="graph" aria-label="Interactive portfolio graph"></div>

  <p class="instructions">
    Drag · Scroll to zoom · Click a project
  </p>

  <script src="projects.js"></script>

  <script>
    const typeNames = {
      W: "Work",
      C: "Competition",
      S: "Study",
      A: "Art",
      I: "Independent"
    };

    const typeOrder = ["W", "C", "S", "A", "I"];

    function cleanProjectTitle(title) {
      return title
        .replace(/^\d{4}_[A-Za-zА-Яа-яЁё]\s*/u, "")
        .trim();
    }

    /*
      Создаём структуру:

      Portfolio
        ├── Work
        ├── Competition
        ├── Study
        ├── Art
        ├── Independent
        └── годы

      Каждый проект связан:
      1. со своим типом;
      2. со своим годом;
      3. с центральным Portfolio через эту структуру.
    */

    const nodes = [
      {
        id: "portfolio-root",
        label: "Portfolio",
        kind: "root",
        radius: 10,
        color: "#ffffff",
        fx: 0,
        fy: 0
      }
    ];

    const links = [];

    const existingTypes = new Set(
      projects.map(project => project.type)
    );

    typeOrder.forEach(type => {
      if (!existingTypes.has(type)) {
        return;
      }

      const typeId = `type-${type}`;

      nodes.push({
        id: typeId,
        label: typeNames[type],
        kind: "type",
        radius: 7,
        color: "#bdbdbd"
      });

      links.push({
        source: "portfolio-root",
        target: typeId,
        kind: "structure"
      });
    });

    const years = [
      ...new Set(projects.map(project => project.year))
    ].sort((a, b) => b - a);

    years.forEach(year => {
      const yearId = `year-${year}`;

      nodes.push({
        id: yearId,
        label: String(year),
        kind: "year",
        radius: 5,
        color: "#777777"
      });

      links.push({
        source: "portfolio-root",
        target: yearId,
        kind: "structure"
      });
    });

    projects.forEach((project, index) => {
      const nodeId = `project-${index}`;

      nodes.push({
        id: nodeId,
        label: cleanProjectTitle(project.title),
        fullTitle: project.title,
        kind: "project",
        radius: 6,
        color: "#eeeeee",
        url: `projects/${project.slug}/`,
        year: project.year,
        type: project.type,
        floatPhase: index * 1.618
      });

      links.push({
        source: `type-${project.type}`,
        target: nodeId,
        kind: "type-link"
      });

      links.push({
        source: `year-${project.year}`,
        target: nodeId,
        kind: "year-link"
      });
    });

    /*
      Мягкая дополнительная физическая сила.

      Она постоянно даёт точкам очень небольшой импульс,
      поэтому граф не застывает полностью и выглядит плавающим.
    */

    function floatingForce() {
      let forceNodes = [];

      function force() {
        const time = performance.now() * 0.00025;

        forceNodes.forEach((node, index) => {
          if (node.kind === "root") {
            return;
          }

          const phase =
            node.floatPhase !== undefined
              ? node.floatPhase
              : index * 1.618;

          node.vx += Math.sin(time + phase) * 0.0014;
          node.vy += Math.cos(time * 0.87 + phase) * 0.0014;
        });
      }

      force.initialize = function initialize(nodesList) {
        forceNodes = nodesList;
      };

      return force;
    }

    const graphElement = document.getElementById("graph");

    const graph = ForceGraph()(graphElement)
      .width(window.innerWidth)
      .height(window.innerHeight)
      .graphData({ nodes, links })

      /*
        Все связи постоянно видимы.
      */

      .linkVisibility(() => true)
      .linkColor(link => {
        if (link.kind === "structure") {
          return "rgba(255, 255, 255, 0.34)";
        }

        if (link.kind === "type-link") {
          return "rgba(255, 255, 255, 0.25)";
        }

        return "rgba(255, 255, 255, 0.16)";
      })
      .linkWidth(link => {
        return link.kind === "structure" ? 1.25 : 0.8;
      })

      /*
        Рисуем точки и подписи вручную,
        чтобы названия были видны постоянно.
      */

      .nodeCanvasObject((node, context, globalScale) => {
        const radius = node.radius || 5;

        context.beginPath();
        context.arc(
          node.x,
          node.y,
          radius,
          0,
          Math.PI * 2
        );

        context.fillStyle = node.color || "#ffffff";
        context.fill();

        if (node.kind === "project") {
          context.beginPath();
          context.arc(
            node.x,
            node.y,
            radius + 3,
            0,
            Math.PI * 2
          );

          context.strokeStyle =
            "rgba(255, 255, 255, 0.18)";

          context.lineWidth = 1 / globalScale;
          context.stroke();
        }

        const fontSize = Math.max(
          10 / globalScale,
          node.kind === "root"
            ? 16 / globalScale
            : 12 / globalScale
        );

        context.font =
          `${node.kind === "root" ? 500 : 400} ` +
          `${fontSize}px Inter, Arial, sans-serif`;

        context.textAlign = "left";
        context.textBaseline = "middle";

        context.fillStyle =
          node.kind === "project"
            ? "rgba(255, 255, 255, 0.92)"
            : "rgba(255, 255, 255, 0.68)";

        context.fillText(
          node.label,
          node.x + radius + 5 / globalScale,
          node.y
        );
      })

      /*
        Делает кликабельной не только точку,
        но и пространство вокруг подписи.
      */

      .nodePointerAreaPaint((node, color, context) => {
        const radius = node.radius || 5;
        const estimatedTextWidth =
          Math.max(35, node.label.length * 7);

        context.fillStyle = color;

        context.beginPath();
        context.arc(
          node.x,
          node.y,
          radius + 5,
          0,
          Math.PI * 2
        );
        context.fill();

        context.fillRect(
          node.x + radius,
          node.y - 10,
          estimatedTextWidth,
          20
        );
      })

      /*
        Переход внутрь проекта.
      */

      .onNodeClick(node => {
        if (node.kind === "project" && node.url) {
          window.location.href = encodeURI(node.url);
          return;
        }

        graph.centerAt(node.x, node.y, 500);
        graph.zoom(2.2, 500);
      })

      /*
        Физика.
      */

      .d3AlphaDecay(0)
      .d3VelocityDecay(0.34)
      .cooldownTime(Infinity)
      .warmupTicks(80);

    graph.d3Force("charge").strength(node => {
      if (node.kind === "root") {
        return -180;
      }

      if (node.kind === "project") {
        return -55;
      }

      return -90;
    });

    graph
      .d3Force("link")
      .distance(link => {
        if (link.kind === "structure") {
          return 135;
        }

        if (link.kind === "type-link") {
          return 95;
        }

        return 115;
      })
      .strength(link => {
        if (link.kind === "structure") {
          return 0.18;
        }

        return 0.1;
      });

    graph.d3Force("float", floatingForce());

    /*
      Начальная посадка графа в окно.
    */

    setTimeout(() => {
      graph.zoomToFit(900, 90);
    }, 900);

    /*
      Подстройка при повороте телефона
      или изменении размера браузера.
    */

    window.addEventListener("resize", () => {
      graph
        .width(window.innerWidth)
        .height(window.innerHeight);
    });
  </script>
</body>
</html>
